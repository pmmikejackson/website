# Old personal domain and bare apex -> canonical www.mikejacksonpm.com
server {
    listen 80;
    server_name themikejackson.com www.themikejackson.com mikejacksonpm.com;
    return 301 https://www.mikejacksonpm.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/xml application/rss+xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- Old Wix URLs (301 so search engines carry rankings over) ---
    location ~ ^/post/(.+?)/?$                 { return 301 /blog/$1; }
    location ~ ^/blog/categories/(.+?)/?$      { return 301 /blog/category/$1; }
    location = /solutions                      { return 301 /work; }
    location = /blank-1                        { return 301 /blog; }
    location ^~ /_files/ugd/                   { return 301 /files/mike-jackson-resume.pdf; }

    # Long cache for fingerprinted build assets and fonts
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /images/ {
        expires 30d;
    }

    location / {
        # Pages are built as /about.html, /blog/<slug>.html
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Drop trailing slashes (/about/ -> /about)
    location ~ ^(.+)/$ {
        return 301 $1;
    }

    error_page 404 /404.html;
}
